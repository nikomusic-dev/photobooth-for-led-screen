<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin - Mur de photos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  #login-screen {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #111; color: white; font-family: sans-serif;
    gap: 12px;
  }
  #login-screen input {
    padding: 10px; border-radius: 6px; border: none; width: 240px;
  }
  #login-screen button {
    padding: 10px 24px; border-radius: 6px; border: none;
    background: #ff4d8d; color: white; font-weight: 600; cursor: pointer;
  }
  #stage {
    display: none;
    position: relative;
    width: 2688px;
    height: 384px;
    transform-origin: top left;
    overflow: hidden;
    background: linear-gradient(135deg, #2d0a4e 0%, #7b2d8e 25%, #e0457b 50%, #ff7a5c 75%, #2fae6e 100%);
    background-size: 300% 300%;
    animation: sunset-move 20s ease infinite;
  }
  @keyframes sunset-move {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #logo-left, #logo-right {
    position: absolute;
    top: 0;
    width: 384px;
    height: 384px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }
  #logo-left { left: 0; }
  #logo-right { right: 0; }
  #logo-left img, #logo-right img {
    max-width: 80%;
    max-height: 60%;
    object-fit: contain;
  }
  .logo-upload-btn {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.3);
    border: 1px dashed rgba(255,255,255,0.4);
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #qr-code {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 90px;
    height: 90px;
    background: white;
    border-radius: 6px;
    padding: 4px;
  }
  #photo-zone {
    position: absolute;
    left: 384px;
    width: 1920px;
    height: 384px;
    top: 0;
  }
  .polaroid {
    position: absolute;
    background: white;
    padding: 10px 10px 36px 10px;
    border-radius: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    width: 220px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .polaroid img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
  }
  .polaroid .caption {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 13px;
    color: #333;
    text-align: center;
    margin-top: 8px;
  }
  .polaroid.entering {
    opacity: 0;
    transform: scale(0.7) rotate(0deg) !important;
  }
  .polaroid.leaving {
    opacity: 0;
  }
  #admin-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    font-family: sans-serif;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Connexion admin</h2>
  <input id="user-input" placeholder="Identifiant" />
  <input id="pass-input" type="password" placeholder="Mot de passe" />
  <button id="login-btn">Connexion</button>
  <div id="login-error" style="color:#ff4d8d; font-size:13px;"></div>
</div>

<div id="stage">
  <div id="admin-badge">ADMIN</div>
  <div id="logo-left">
    <img id="logo-left-img" style="display:none;" />
    <label class="logo-upload-btn">Charger logo gauche<input type="file" id="logo-left-input" accept="image/*" style="display:none;"></label>
  </div>
  <div id="photo-zone"></div>
  <div id="logo-right">
    <img id="logo-right-img" style="display:none;" />
    <label class="logo-upload-btn">Charger logo droit<input type="file" id="logo-right-input" accept="image/*" style="display:none;"></label>
    <img id="qr-code" />
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const SERVER_URL = "https://niko-photobooth-for-led-screen.onrender.com";
const GUEST_URL = "https://niko-photobooth-01.netlify.app/guest.html";
const ADMIN_USER = "NIKO";
const ADMIN_PASS = "27012022";

const MAX_SLOTS = 4;
const BASE_DURATION = 30000;
const MIN_DURATION = 10000;
const QUEUE_THRESHOLD = 3;

let photoQueue = [];
let activeSlots = [];
let seenIds = new Set();
let pollInterval = null;

// --- Connexion ---
document.getElementById("login-btn").addEventListener("click", () => {
  const u = document.getElementById("user-input").value;
  const p = document.getElementById("pass-input").value;
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("stage").style.display = "block";
    fitStage();
    initQR();
    startPolling();
  } else {
    document.getElementById("login-error").textContent = "Identifiants incorrects";
  }
});

// --- Mise à l'échelle de la scène 2688x384 dans la fenêtre du navigateur ---
function fitStage() {
  const stage = document.getElementById("stage");
  const scale = Math.min(window.innerWidth / 2688, window.innerHeight / 384);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener("resize", fitStage);

// --- QR code vers la page invité ---
function initQR() {
  QRCode.toDataURL(GUEST_URL, { width: 200, margin: 1 }, (err, url) => {
    if (!err) document.getElementById("qr-code").src = url;
  });
}

// --- Logos ---
function setupLogoUpload(inputId, imgId) {
  document.getElementById(inputId).addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
      const img = document.getElementById(imgId);
      img.src = URL.createObjectURL(file);
      img.style.display = "block";
    }
  });
}
setupLogoUpload("logo-left-input", "logo-left-img");
setupLogoUpload("logo-right-input", "logo-right-img");

// --- Récupération des nouvelles photos depuis le serveur ---
function startPolling() {
  pollInterval = setInterval(fetchNewPhotos, 3000);
  fetchNewPhotos();
}

async function fetchNewPhotos() {
  try {
    const res = await fetch(`${SERVER_URL}/api/photos`);
    const photos = await res.json();
    photos.forEach(p => {
      if (!seenIds.has(p.id)) {
        seenIds.add(p.id);
        photoQueue.push(p);
      }
    });
    processQueue();
  } catch (err) {
    console.error("Erreur de récupération des photos", err);
  }
}

// --- Logique d'affichage adaptatif ---
function currentDuration() {
  if (photoQueue.length >= QUEUE_THRESHOLD) return MIN_DURATION;
  const steps = photoQueue.length;
  const reduction = (BASE_DURATION - MIN_DURATION) * (steps / QUEUE_THRESHOLD);
  return Math.max(MIN_DURATION, BASE_DURATION - reduction);
}

function processQueue() {
  while (activeSlots.length < MAX_SLOTS && photoQueue.length > 0) {
    const photo = photoQueue.shift();
    showPhoto(photo);
  }
}

const slotPositions = [
  { left: 60,  top: 70,  rot: -6 },
  { left: 430, top: 40,  rot: 4 },
  { left: 820, top: 90,  rot: -3 },
  { left: 1190, top: 30, rot: 6 },
  { left: 1560, top: 80, rot: -5 }
];

function showPhoto(photo) {
  const zone = document.getElementById("photo-zone");
  const el = document.createElement("div");
  el.className = "polaroid entering";
  const pos = slotPositions[activeSlots.length % slotPositions.length];
  el.style.left = pos.left + "px";
  el.style.top = pos.top + "px";
  const img = document.createElement("img");
  img.src = photo.url;
  el.appendChild(img);
  const cap = document.createElement("div");
  cap.className = "caption";
  cap.textContent = photo.caption || "";
  el.appendChild(cap);
  zone.appendChild(el);

  requestAnimationFrame(() => {
    el.style.transform = `rotate(${pos.rot}deg) scale(1)`;
    el.classList.remove("entering");
  });

  const slot = { el, photo };
  activeSlots.push(slot);

  const duration = currentDuration();
  setTimeout(() => removePhoto(slot), duration);
}

function removePhoto(slot) {
  slot.el.classList.add("leaving");
  setTimeout(() => {
    slot.el.remove();
    activeSlots = activeSlots.filter(s => s !== slot);
    processQueue();
  }, 600);
}
</script>
</body>
</html>
